<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keranjang — DapurKita</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>

  <link rel="stylesheet" href="../css/customer.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="page-header">
    <div class="header-inner container page-header-inner">
      <a href="../index.html" class="btn-back" title="Kembali">
        <i class="ph ph-arrow-left"></i>
      </a>
      <h1 class="page-title">Keranjang Belanja</h1>
    </div>
  </header>

  <!-- ===== CART CONTENT ===== -->
  <main class="cart-page container">

    <!-- Empty State -->
    <div class="empty-state hidden" id="emptyCart">
      <span class="empty-icon">🛒</span>
      <h3>Keranjang masih kosong</h3>
      <p>Yuk, tambahkan menu favoritmu terlebih dahulu!</p>
      <a href="../index.html" class="btn-home" style="margin-top:24px;">
        <i class="ph ph-arrow-left"></i>
        Lihat Menu
      </a>
    </div>

    <!-- Cart List -->
    <div id="cartList"></div>

  </main>

  <!-- ===== CART SUMMARY (STICKY BOTTOM) ===== -->
  <div class="cart-summary hidden" id="cartSummary">
    <div class="cart-summary-inner">
      <div>
        <div class="cart-total-label">Total Pembayaran</div>
        <div class="cart-total-amount" id="totalAmount">Rp 0</div>
      </div>
      <a href="checkout.html" class="btn-checkout">
        Checkout
        <i class="ph ph-arrow-right"></i>
      </a>
    </div>
  </div>

  <script type="module" src="../js/customer/cart.js"></script>
</body>
</html>
