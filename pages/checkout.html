<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — DapurKita</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>

  <link rel="stylesheet" href="../css/customer.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="page-header">
    <div class="header-inner container page-header-inner">
      <a href="cart.html" class="btn-back" title="Kembali ke Keranjang">
        <i class="ph ph-arrow-left"></i>
      </a>
      <h1 class="page-title">Konfirmasi Pesanan</h1>
    </div>
  </header>

  <!-- ===== CHECKOUT FORM ===== -->
  <main class="checkout-page container">

    <!-- RINGKASAN PESANAN -->
    <div class="checkout-section">
      <h2 class="section-title">
        <i class="ph ph-receipt"></i>
        Ringkasan Pesanan
      </h2>

      <!-- Daftar item akan di-inject oleh checkout.js -->
      <div id="summaryList"></div>

      <div class="order-total-row">
        <span class="order-total-label">Total</span>
        <span class="order-total-price" id="summaryTotal">Rp 0</span>
      </div>
    </div>

    <!-- DATA PELANGGAN -->
    <div class="checkout-section">
      <h2 class="section-title">
        <i class="ph ph-user-circle"></i>
        Data Pelanggan
      </h2>

      <form id="checkoutForm" novalidate>

        <!-- Nama -->
        <div class="form-group">
          <label for="inputNama" class="form-label">
            Nama  <span>*</span>
          </label>
          <input
            type="text"
            id="inputNama"
            class="form-control"
            placeholder="Masukkan nama untuk memanggil ketika pesanan siap"
            required
            autocomplete="nickname"
          />
        </div>

        <!-- WhatsApp -->
        <!-- Nomor Meja -->
<div class="form-group">
  <label for="inputMeja" class="form-label">
    Nomor Meja <span>*</span>
  </label>

  <select
    id="inputMeja"
    class="form-control"
    required
  >
    <option value="">Pilih nomor meja</option>
    <option value="1">Meja 1</option>
    <option value="2">Meja 2</option>
    <option value="3">Meja 3</option>
    <option value="4">Meja 4</option>
    <option value="5">Meja 5</option>
    <option value="6">Meja 6</option>
    <option value="7">Meja 7</option>
    <option value="8">Meja 8</option>
    <option value="9">Meja 9</option>
    <option value="10">Meja 10</option>
  </select>
</div>

        <!-- Catatan -->
        <div class="form-group">
          <label for="inputCatatan" class="form-label">
            Catatan Pesanan
          </label>
          <textarea
            id="inputCatatan"
            class="form-control"
            placeholder="Contoh: tidak pedas, tanpa kecap, dll."
          ></textarea>
        </div>
<!-- Gender -->
<div class="form-group">
  <label class="form-label">
    Gender
  </label>

  <div class="gender-switch">
    <button type="button" class="gender-btn active" data-gender="Laki-laki">
      Laki-laki
    </button>

    <button type="button" class="gender-btn" data-gender="Perempuan">
      Perempuan
    </button>
  </div>

  <input type="hidden" id="inputGender" value="Laki-laki" />
</div>
        <!-- Tombol Submit -->
        <button type="submit" class="btn-submit" id="btnSubmit">
          <i class="ph ph-paper-plane-tilt"></i>
          Pesan Sekarang
        </button>

      </form>
    </div>

  </main>

  <script type="module" src="../js/customer/checkout.js"></script>
  <script type="module" src="../js/customer/cart.js"></script>
</body>
</html>
