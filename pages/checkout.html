<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — DapurKita</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>

  <link rel="stylesheet" href="../css/customer.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="page-header">
    <div class="header-inner container page-header-inner">
      <a href="cart.html" class="btn-back" title="Kembali ke Keranjang">
        <i class="ph ph-arrow-left"></i>
      </a>
      <h1 class="page-title">Konfirmasi Pesanan</h1>
    </div>
  </header>

  <!-- ===== CHECKOUT FORM ===== -->
  <main class="checkout-page container">

    <!-- RINGKASAN PESANAN -->
    <div class="checkout-section">
      <h2 class="section-title">
        <i class="ph ph-receipt"></i>
        Ringkasan Pesanan
      </h2>

      <!-- Daftar item akan di-inject oleh checkout.js -->
      <div id="summaryList"></div>

      <div class="order-total-row">
        <span class="order-total-label">Total</span>
        <span class="order-total-price" id="summaryTotal">Rp 0</span>
      </div>
    </div>

    <!-- DATA PELANGGAN -->
    <div class="checkout-section">
      <h2 class="section-title">
        <i class="ph ph-user-circle"></i>
        Data Pelanggan
      </h2>

      <form id="checkoutForm" novalidate>

        <!-- Nama -->
        <div class="form-group">
          <label for="inputNama" class="form-label">
            Nama Lengkap <span>*</span>
          </label>
          <input
            type="text"
            id="inputNama"
            class="form-control"
            placeholder="Masukkan nama lengkap Anda"
            required
            autocomplete="name"
          />
        </div>

        <!-- WhatsApp -->
        <div class="form-group">
          <label for="inputWhatsapp" class="form-label">
            Nomor WhatsApp <span>*</span>
          </label>
          <input
            type="tel"
            id="inputWhatsapp"
            class="form-control"
            placeholder="Contoh: 08123456789"
            required
            autocomplete="tel"
          />
        </div>

        <!-- Catatan -->
        <div class="form-group">
          <label for="inputCatatan" class="form-label">
            Catatan Pesanan
          </label>
          <textarea
            id="inputCatatan"
            class="form-control"
            placeholder="Contoh: tidak pedas, tanpa kecap, dll."
          ></textarea>
        </div>

        <!-- Tombol Submit -->
        <button type="submit" class="btn-submit" id="btnSubmit">
          <i class="ph ph-paper-plane-tilt"></i>
          Pesan Sekarang
        </button>

      </form>
    </div>

  </main>

  <script type="module" src="../js/customer/checkout.js"></script>
  <script type="module" src="../js/customer/cart.js"></script>
</body>
</html>
